summary: >-
  测试计划覆盖 AC-001 至 AC-008，保留原 34 项保护性测试，
  并补充统一身份、实际分发后的引用可移植性及新环境变量行为验证。
  Oracle、隔离方式、失败分类和证据绑定足以支持本次有界维护，
  未发现阻断测试实施的缺口。

findings: []

verified:
  - 原 34 项测试全部保留执行，仅允许批准改名直接导致的输入适配，不允许删除断言或改为 Skip。
  - 命名回归覆盖包、锁文件、团队配置、自有 Skill、规则、回执、受管理标记及生成元数据。
  - 治理解析、脏目标、过期预览、链接、并发写入、恢复及流程保护沿用既有严格 Oracle。
  - 实际 TeamAI 分发、Git 刷新、可信 CI 和受限运行时安装保留真实边界验证。
  - 文档检查覆盖团队仓入口与实际分发包的相对引用，避免仅验证源仓链接存在。
  - 六份导入包共 725 文件及来源锁逐项比对；当前 .git 另以完整清单检查不变。
  - 全树扫描覆盖仓内相对路径、普通文件字节、符号链接目标、隐藏与忽略条目，不跟随链接访问其他工程。
  - 历史归档及原始测试输出保留在仓外；规范化报告不冒称原始输出，旧报告不重新绑定候选。
  - 生产与测试修改串行，最终受测候选同时包含实际生产和测试代码。
  - 必需本地验证失败与环境受限分别报告，原生宿主调用未运行不冒称通过。

scope_interpretation:
  - 当前工作目录的绝对定位前缀不作为待消除的仓内标识，不要求目录搬迁。
  - 仓内相对路径、内容及链接目标仍须完整扫描，不能据定位前缀例外扩大排除范围。
  - 扫描发现不得通过修改 .git 对象、历史或受保护上游文件解决。
  - 既有安装只核查可审阅迁移指引与安全拒绝行为，不执行自动删除或兼容别名安装。

evidence_boundary:
