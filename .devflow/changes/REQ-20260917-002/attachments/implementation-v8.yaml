  "implementation": [
    "Preparation returns only after body, cleanup, descriptor close and unlock have completed successfully. Errors retain their cause and are aggregated rather than masking the original operation.",
    "Work/candidate ownership records object identity and every parent directory at creation. Cleanup validates the original lock and the recorded chain before recursive deletion; unknown replacements are preserved.",
    "Each npm boundary also verifies owned directories and lock before and after execution, rejecting identity drift before proceeding.",
    "Pointer recovery covers work-cleanup and unlock failures as well as body errors. It requires unchanged namespace, original lock and the exact published pointer identity/bytes; restore files are independent from work.",
    "If recovery is not safe, candidate and residual objects remain, and the returned error reports observed current state and the recovery failure. No failure is converted to success.",
    "Descriptor close and lock release are independent from earlier cleanup errors. Descriptor close is attempted once because OS close errors can mean the descriptor was already released; an ambiguous close is reported rather than retried against a potentially reused descriptor.",
    "Public APIs, receipt schemas, dependency versions, source selection, actual CLI verification and session/distribution behavior remain unchanged. Existing function composition is retained; no class framework or new test bypass is added."
  ],
