  "implementation": [
    "Public resolveTeamaiRuntime rejects every outstanding prepare.lock before reading and again before returning. It rechecks namespace ancestor/object identity and the selected current pointer identity and bytes.",
    "Installation selection is a private function with no exported skip-lock parameter. Prepare reuses it only within a local held-runtime helper that asserts its own lock and original current before and after verification.",
    "A reader overlapping an unfinished prepare cannot receive a tentative candidate. Pointer drift during verification is conservatively rejected; an already returned committed installation is retained across later upgrades.",
    "Existing cleanup ownership, pointer recovery, independent descriptor close and lock release handling remain unchanged. No dependency, upstream, receipt schema or session behavior is changed.",
    "The only compatibility tightening is refusal of pending or stale preparation locks by the public resolver; no automatic lock cleanup or invented ownership is added."
