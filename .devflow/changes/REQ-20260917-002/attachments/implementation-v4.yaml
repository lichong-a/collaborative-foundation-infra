    "method": "Validate complete locked bytes, file set and executable modes, then atomically move each explicit path to a new external archive without replacing existing paths. No ordinary command adopts or removes leftovers."
  },
  "summary": "Consume the two fixed real submodules directly. Source preparation is now read-only. Assemble a private seven-Skill TeamAI tree per distribution and validate the actual output against narrowly transformed expected bytes.",
  "reused_existing_patterns": [
    "Reuse strict repository path, file inventory and source pin validation.",
    "Reuse the existing Markdown parser and replaceLink implementation for syntax-bearing link targets only.",
    "Reuse whole-output preflight, exact matching no-write project entries, atomic entry replacement, conservative receipt validation and serial source rechecks.",
    "Keep existing session state meaning and trusted-baseline CI; generate the bundle with the existing locked esbuild toolchain."
  ],
  "design_decisions": [
    "sources.lock schema3 packages.path is the actual repository-relative upstream package path. Original 725 file identities and both upstream commits remain unchanged; redundant sourcePath is rejected.",
    "prepareSkills and verifyUpstreams produce no folders, locks or ownership receipts and do not fetch or execute upstream code. Missing initialization produces an explicit instruction; old copies, unknown siblings and legacy preparation files remain intact and fail verification.",
    "tools/skill-resources.mjs calculates the complete source and distribution manifests without source writes. No .git, absolute checkout location or preparation state participates in the digest.",
    "Only SKILL.md plus references/session.md, adoption.md and design.md may relocate their registered upstream Markdown navigation targets. Internal navigation, external URLs, code and ordinary prose retain original bytes. Missing or unknown cross-package mappings fail.",
    "Only the self Skill changes during layout relocation. Six upstream packages are copied intact from their actual source paths. Complete seven-package bytes and normalized executable modes must match the actual pinned TeamAI output.",
    "Distribution receipt schema3 binds sourceLayoutVersion3, sourcePackagesDigest and distributionDigest. Old installation receipts are preserved and rejected; they cannot silently certify the new transformation.",
    "Every currently matched project entry is still re-read, including noncurrent harness entries. Plain apply never writes entries; a complete block with dirty outside text remains a no-write match. Explicit disables, unknown custom resources and unsafe objects retain their earlier protections.",
    "Project rules, onboarding, maintenance and self Skill routes now identify direct upstream consumption and read-only preparation. Session identity remains private and shared profiles do not copy mode history."
  ],
