prior_findings:
  - id: PROD-TA-RUNTIME-001
    status: code_path_addressed_pending_independent_validation
    evidence: >-
      清理、fd close 和锁释放错误被统一收集；发布后错误进入 recover，
      恢复不再依赖可能已删除的 work。无法安全恢复时输出实际指针状态并保留证据。
  - id: PROD-TA-RUNTIME-002
    status: code_path_addressed_pending_independent_validation
    evidence: >-
      创建时记录目录及父链身份；removeOwned 在删除前检查锁和目录归属。
      身份替换时保全退出，前项清理失败不会跳过 fd close。

findings:
  - id: PROD-TA-RUNTIME-003
    severity: P2
    category: concurrent-publication
    location:
      path: tools/teamai-runtime.mjs
      lines: "87-107,189-212"
    trigger: >-
      升级 B 已发布 current，198 行 work 清理完成，但尚未完成 fd close 和锁释放。
      此时另一进程成功 resolve 当前运行时；随后准备进程的 close 或 unlink 失败。
    evidence: >-
      namespaceState 允许 prepare.lock 存在，resolveTeamaiRuntime 不检查准备事务是否结束。
      work 删除后命名空间和完整 B 回执均可通过读取校验，读取者可获得 B entry。
      随后 208 或 212 行调用 recover 和 cleanupFailedCandidate，
      将 current 恢复 A 并删除已经暴露给读取者的 B。
    impact: >-
      读取者获得的已验证运行时路径可能在函数返回后被收尾回滚删除，
      导致并发分发执行失败；事务的对外可见性早于实现声明的最终提交边界。
    safe_fix: >-
      让运行时解析与准备事务共享明确的完成边界：
      对外读取在未完成准备事务期间保守拒绝或有界等待，
      并在返回身份前确认没有跨越未完成事务；
      或采用不会删除已对外暴露安装的等价方案。
      内部持锁核验须与外部读取区分，不以全局跳过锁检查实现。
    validation: >-
      在成功 work 清理后、fd close 前设置屏障，让第二进程 resolve；
      然后注入 close 或锁释放失败。读取者应明确拒绝未完成事务，
      或其成功取得的安装在准备失败后仍保持可用，
      不得返回随后被回滚删除的 entry。

