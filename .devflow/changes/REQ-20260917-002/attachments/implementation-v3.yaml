summary: Reverify every project entry claimed as currently matched, including the other harness entry and ordinary sync without --install-entry. Remove private session identity requirements from shared project profiles and adoption reports.
reused_existing_patterns:
  - Reuse the existing read-only preflightEntry matcher and its exact-block/no-write branch.
  - Preserve existing whole-output preflight, repeated publication checks and conservative failure behavior.
  - Continue using the approved esbuild generator; no dependency or index changes.
design_decisions:
  - preflightReceipt now verifies actual entry files for every recorded projectEntries key; absence, altered/removed markers or unsafe object types refuse before target publication.
  - Before receipt commit and return, verify all current matched claims again, including newly installed or noncurrent-harness entries.
  - The verifier reads only; ordinary --apply never repairs or restores an entry. Complete matched blocks preserve dirty outside text and leave receipt/entry bytes unchanged on noop.
  - Shared project profile and adoption report only identify the governing protocol and standard links. Concrete root IDs, selection files and history stay in private state or explicitly scoped session handoffs.
