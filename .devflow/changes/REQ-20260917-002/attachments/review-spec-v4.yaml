verdict: APPROVE
summary: >-
  Spec4 足够支持本轮实施。新增官方来源、十包完整分发、首次或显式升级解析
  latest、运行时与资源来源分离，以及内置同名资源覆盖检查都有明确行为和失败边界。
  现有安装保护、只读准备、可信 CI、会话选择与交付职责保持明确。
  本轮完成规格复审，未发现有证据的阻断项；不沿用 Spec3 的实现或测试通过结果批准新行为。

review_results:
  - >-
    包数量与来源关系闭合：两个 RIC 来源提供六包，新增官方来源提供两包，
    加上工程规范与自有 CLI 入口共十包。固定来源、官方指南及许可证的归属明确。
  - >-
    已核对现有 sources、distribution、skill-resources 和 CI 的两个来源、
    七包及 0.24.0 硬约束；Spec4 明确要求替换这些约束，同时保留旧回执、
    定制内容、禁用配置和入口的拒绝覆盖保护。
  - >-
    latest 的解析限定于首次准备或显式升级；已有完整运行时离线核验复用。
    CLI 升级不修改资源 gitlink 或来源锁，失败保留当前运行时及回执，
    不以回退或直接复制掩盖不兼容。
  - >-
    实际隔离 pull 输出与完整预期清单比较，以及内置同名或额外 Skill 检测，
    能覆盖官方 CLI 覆盖团队资源的实际风险；未来版本不兼容时允许明确拒绝，
    不承诺任意 latest 均可使用。
  - >-
    已读本地官方 Skill 中的代理编排、父目录输出、progress 状态和直接推送约定。
    Spec4 对默认不调用、输出范围确认、活动 DevFlow 内禁止启动另一套完整调度、
    专项进度不映射 Gate、草稿与发布授权分离作出了对应限制。
  - >-
    变更预算、生产与测试写入者、旧来源及历史保护范围明确；
    独立候选和隔离验收可以实施，不要求通过主仓提交扩大当前授权。

