residual_risks:
  - >-
    将来 latest 的内置 Skills 或 CLI 行为可能与固定官方来源不兼容；
    当前规格的正确结果是兼容检查失败并保留既有安装，不能据此自动升级来源锁。
  - >-
    官方 Skill 原文保留意味着其默认动作仍须受自有入口及当前用户授权约束；
    这些是 Agent 协议边界，不能当作系统级拦截或原生宿主已加载的证据。
  - >-
    新测试计划、实际实现、十包真实分发及运行时准备尚需本轮独立验证；
    本结论不批准这些未送审产物，也不代表正式 G5–G10 或发布完成。

