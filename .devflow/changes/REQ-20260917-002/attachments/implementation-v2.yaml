documentation:
  - README and onboarding describe explicit init/prepare, resource-only versus entry installation, and independent mode choice.
  - Self Skill session/manual references define identity, user selection, fork/resume/child rules, basic scope, switching, failures and manual handoff recovery.
  - Engineering structure, delivery, evidence, adoption and templates apply the same boundaries in both modes.
  - Maintenance records owned-export upgrades, interrupted publication recovery, CI boundaries and private backup practices; validation links current evidence without asserting unexecuted approvals.
migrations:
  - Verified archived legacy expanded packages were moved outside the repository before first prepare. Their original 725 file manifests remain byte-for-byte and mode-for-mode unchanged in sources.lock.
  - Only .gitmodules, two gitlinks and 725 package tracking removals were staged. No main commit, push, branch change or remote change was performed.
  - Prior schema/version installation receipts and customized targets remain preserved and require separate reviewed migration.
rollback:
  - Original full-tree recovery archive remains with the Planner; no rollback of active work was performed.
  - Local production snapshot contains complete production file bytes and mode manifest, verified baseline/upstream bundles, and staged/working patches. Restore only into a new isolated target; include Tester/Planner artifacts separately from their owners.
  - Partial export/publication output is preserved for explicit evidence-guided recovery; do not clear unknown content or force-overwrite to pass checks.
known_risks:
  - Filesystem publication uses cooperative serial locks; it is not a transaction across every distributed resource nor an OS sandbox against hostile writers.
  - Manual session recovery is an explicit operator/Agent protocol with history verification, not an automatic import CLI.
  - Native host loading and native-role behavior remain unverified by these file/process self-checks.
