summary: Pinned real upstream submodules, deterministic owned exports, explicit root-session selection, atomic project entry publication, and shared engineering standards for devflow/basic are implemented locally.
reused_existing_patterns:
  - Existing ESM functions and repository path/hash/Git helpers; no new runtime or production dependencies.
  - Existing isolated real TeamAI pull, exclusive resource publication, build generator and trusted-baseline CI.
  - Read the installed design-pattern Skill and JavaScript routing before implementation; functions and composition cover these bounded source/session adapters without a State hierarchy.
design_decisions:
  - Index gitlink, initialized clean upstream HEAD and source lock must agree; no auto-fetch, auto-checkout or upstream code execution.
  - Unknown even byte-identical export directories are never adopted. Own unchanged exports require a full valid receipt; interrupted publication remains visible and refused.
  - A session identity combines project common-dir/root digest, actual harness and root-session digest. Child calls can only read/inherit; no dialogue or task state is persisted.
  - Status is read-only; root selection uses private directories/files, exclusive locks, atomic publication, full history and version binding. Manual fallback records require explicit history-preserving reconciliation.
  - Resources, entry and receipt are checked together before publication. Equal complete entry blocks are matched/no-write; append requires clean tracked existing text. Complete temporary entry bytes are synced and original inode/bytes rechecked before atomic replacement.
  - Installation, matching entry bytes and actual host loading are separate facts. No real session choice has been fabricated for this implementation conversation.
  - Both modes share module and documentation standards. Only devflow loads the upstream delivery Skill bodies and native roles; basic retains old state read-only.
  - CI reads trusted baseline policy/artifact/source locks and flags submodule, preparer, Skill and AGENTS/CLAUDE changes for independent review.
