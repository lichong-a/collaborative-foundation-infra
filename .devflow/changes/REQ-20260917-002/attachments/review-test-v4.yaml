summary: >-
  TestPlan4 对 Spec4 和 technical-v5 的新增行为具有可执行、可观察的验收标准。
  已完成全部相关维度审核，未发现阻断项。批准的是计划及其 Oracle，
  不代表新实现、运行时安装或十包分发已经通过。
review_results:
  - >-
    首装固定一次 latest 解析、完整安装离线复用、规范更新后离线重核、
    显式升级原子切换、失败保旧及并发/中断分别有命名用例。
  - >-
    runNpm 注入限于 npm 进程边界；身份、SRI、文件校验及真实 pull
    不允许绕过。真实用户配置和缓存哨兵、安装脚本禁用及清理归属均有 Oracle。
  - >-
    三宿主十包实际输出与独立期望比较，覆盖内置同名覆盖、额外内置 Skill、
    未知输出、缺件和漂移；直接复制或模拟 pull 不能替代真实分发。
  - >-
    固定来源和指南转换期望由测试者独立建立；源码与安装导航分别检查，
    保留原包字节及有效执行位，未知、歧义和越界链接不能静默放行。
  - >-
    保留原 28 个追踪 ID、62 组中的有效行为及 6 组补充保护；
    两源、七包、schema3 和固定 CLI 版本的失效假设有明确替代矩阵，
    不以保留组数代替保护断言。
  - >-
    既有安装、禁用配置、入口原文与陈旧回执、会话身份、可信 CI、
    只读准备及主仓保护均继续覆盖，新增包纳入整体预检。
  - >-
    旧基线与新验收明确分离；live latest 不兼容或不可验证时有准确退出标准，
    拒绝行为通过不能冒充安装成功或整体闭环通过。
